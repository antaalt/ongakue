[package]
name = "ongakue"
version.workspace = true
edition.workspace = true

[dependencies]
analysis.workspace = true
render.workspace = true
web-time = "1"
# Shared links: compressed shader code, as URL-safe text.
base64 = "0.23"
miniz_oxide = "0.9"
winit.workspace = true
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = [
    "AnalyserNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BiquadFilterNode",
    "BiquadFilterType",
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "File",
    "FileList",
    "GainNode",
    "Element",
    "Event",
    "HtmlAnchorElement",
    "HtmlButtonElement",
    "HtmlCollection",
    "HtmlOptionsCollection",
    "HtmlCanvasElement",
    "HtmlDocument",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlOptionElement",
    "HtmlSelectElement",
    "History",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MidiAccess",
    "MidiInput",
    "MidiInputMap",
    "MidiMessageEvent",
    "MidiPort",
    "MouseEvent",
    "Navigator",
    "Node",
    "OscillatorNode",
    "OscillatorType",
    "Storage",
    "TextMetrics",
    "Url",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
env_logger = "0.11"
