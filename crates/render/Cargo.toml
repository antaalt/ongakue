[package]
name = "render"
version.workspace = true
edition.workspace = true

[dependencies]
analysis.workspace = true
bytemuck = { version = "1", features = ["derive"] }
# Same version as wgpu's, to validate edited shaders with readable errors.
# Also reads GLSL visuals, and translates them to WGSL.
naga = { version = "30", features = ["wgsl-in", "glsl-in", "wgsl-out"] }
wgpu.workspace = true
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGPU when the browser supports it, WebGL2 otherwise.
wgpu = { workspace = true, features = ["webgpu", "webgl"] }
# To create the WebGL2 context, asking for the discrete GPU.
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["dx12", "metal", "vulkan"] }

[dev-dependencies]
# Tests check that visuals translate to the GLSL of WebGL2, like wgpu does.
naga = { version = "30", features = ["glsl-out"] }
