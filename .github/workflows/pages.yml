name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: v0.21.14
  # shader-language-server's release for the shader editor. Nightly: the
  # tagged releases (up to v1.6.2) don't import their memory, which the
  # browser host in web/lsp/ needs.
  SHADER_LANGUAGE_SERVER_RELEASE: nightly

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Run test
        run: cargo test -- --nocapture
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"

      # Not committed (20 MB): see "The language server" in the README.
      - name: Download shader-language-server
        run: |
          curl -sSL -o shader-language-server.zip \
            "https://github.com/antaalt/shader-sense/releases/download/${SHADER_LANGUAGE_SERVER_RELEASE}/shader-language-server-wasm32-wasip1-threads.zip"
          unzip -o shader-language-server.zip shader-language-server.wasm -d web/lsp

      - id: pages
        uses: actions/configure-pages@v6

      # Pages serves the site from a sub-path (/<repo>/), so assets must use it.
      - name: Build
        run: trunk build --release --public-url "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
